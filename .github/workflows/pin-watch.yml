# Weekly check of the pinned build inputs against their upstreams.
#
# Reads the pins from the repository with tools/_build/pin_watch.py (Claude
# Code in the packaged native contract, the gateway and its Go toolchain in
# gateway/UPSTREAM.json's upstream.version and toolchain.version, the Python
# runtime in packaging/python-runtimes.json), asks the public upstream
# metadata for the newest versions, and opens (or updates) one issue when
# something is newer. A pin or an upstream version that cannot be read fails
# the job instead of reporting nothing. It never changes the repository and
# never publishes. The weekly schedule runs only while the repository
# variable CM_SCHEDULES is "on"; a manual run is not affected.

name: pin-watch

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pin-watch
  cancel-in-progress: true

jobs:
  watch:
    if: github.event_name != 'schedule' || vars.CM_SCHEDULES == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open or update the pin-watch issue (and its label)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          {
            printf 'claude_code=%s\n' "$(npm view @anthropic-ai/claude-code dist-tags.stable 2>/dev/null || true)"
            printf 'gateway=%s\n' "$(gh api repos/router-for-me/CLIProxyAPI/releases/latest --jq .tag_name || true)"
            printf 'python_build_standalone=%s\n' "$(gh api repos/astral-sh/python-build-standalone/releases/latest --jq .tag_name || true)"
            printf 'go=%s\n' "$(curl --proto '=https' -fsSL 'https://go.dev/dl/?mode=json' | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["version"])' || true)"
          } >"$RUNNER_TEMP/upstream.env"
      - name: Compare with the pins
        id: compare
        run: |
          umask 077
          python3 tools/_build/pin_watch.py pins
          python3 tools/_build/pin_watch.py compare --upstream "$RUNNER_TEMP/upstream.env" >"$RUNNER_TEMP/report.md"
          if [ -s "$RUNNER_TEMP/report.md" ]; then echo "changed=true" >>"$GITHUB_OUTPUT"; fi
      - name: Open or update the pin-watch issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          umask 077
          number=$(gh issue list --state open --label pin-watch --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/report.md"
          else
            gh label create pin-watch --description "pinned inputs with newer upstreams" --force
            gh issue create --title "Pinned inputs have newer upstream versions" --label pin-watch \
              --body-file "$RUNNER_TEMP/report.md"
          fi
