# Temporary diagnostic branch only. The frozen candidate's release graph and
# required Windows gate are unchanged; this branch cannot promote a release.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: frozen candidate commit to diagnose
        required: true
        type: string
      draft:
        description: must be false for this diagnostic
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: wsl-resume-diag-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  wsl-resume-diag:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Only the frozen candidate, never a draft
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if ($env:INPUT_REF -cne '8b4ec9e1572d41d33396dbc67a3a1951bb2561b0' -or $env:INPUT_DRAFT -cne 'false') {
            throw 'Diagnostic requires the exact frozen SHA and draft=false'
          }
          if ($env:GITHUB_REF -cne 'refs/heads/ci/wsl-resume-diag') { throw 'Diagnostic branch only' }
      - name: Diagnostic harness, not the product under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Pristine immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8b4ec9e1572d41d33396dbc67a3a1951bb2561b0
          path: candidate
          persist-credentials: false
      - name: Identify the original attempt-one dist artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:CM_DIAG_METADATA = Join-Path $env:RUNNER_TEMP 'wsl-resume-meta'
          $env:CM_DIAG_UPLOAD = Join-Path $env:RUNNER_TEMP 'wsl-resume-validated'
          $null = New-Item -ItemType Directory -Path $env:CM_DIAG_METADATA
          "CM_DIAG_METADATA=$env:CM_DIAG_METADATA" >> $env:GITHUB_ENV
          "CM_DIAG_UPLOAD=$env:CM_DIAG_UPLOAD" >> $env:GITHUB_ENV
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $artifact = Invoke-RestMethod -Headers $headers -TimeoutSec 30 `
            -Uri 'https://api.github.com/repos/nkoturovic/claude-multi/actions/artifacts/11488260478'
          if ($artifact.id -ne 11488260478 -or $artifact.name -cne 'dist' -or $artifact.expired -or
              $artifact.size_in_bytes -ne 204873528 -or
              $artifact.digest -cne 'sha256:c3d5f116bccab719c962df4502dca9efcbcca5ef0884ced6af7dcd8514fff6d3' -or
              $artifact.workflow_run.id -ne 37633707710 -or
              $artifact.workflow_run.head_sha -cne '8b4ec9e1572d41d33396dbc67a3a1951bb2561b0') {
            throw 'Original artifact identity unavailable or changed; no substitute'
          }
          $row = @{ schema = 1; repository = 'nkoturovic/claude-multi'; run_id = 37633707710L
            artifact_id = 11488260478L; name = 'dist'; size_bytes = 204873528
            digest = $artifact.digest; head_sha = $artifact.workflow_run.head_sha }
          [IO.File]::WriteAllText((Join-Path $env:CM_DIAG_METADATA 'artifact.json'), ($row | ConvertTo-Json -Compress))
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "11488260478"
          repository: nkoturovic/claude-multi
          run-id: "37633707710"
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Check every original SHA256SUMS member before installation
        timeout-minutes: 3
        run: |
          python harness/.github/scripts/wsl_diag.py verify-dist dist "$env:CM_DIAG_METADATA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git -C candidate rev-parse HEAD).Trim() -cne '8b4ec9e1572d41d33396dbc67a3a1951bb2561b0') {
            throw 'Wrong candidate checkout'
          }
      - name: Original WSL readiness and ordinary-user preparation (no Pester)
        timeout-minutes: 10
        run: |
          . ./dist/install.ps1
          if (-not (Test-WslReady)) { Install-Wsl -AssumeYes }
          if (-not (Test-WslReady)) { throw 'WSL 2 needs a restart this runner cannot make' }
          wsl --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = (wsl --distribution Ubuntu-24.04 --user root --exec wslpath -a "$PWD/candidate").Trim()
          wsl --distribution Ubuntu-24.04 --user root --cd "$candidate" --exec sh .github/scripts/wsl_prepare.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --distribution Ubuntu-24.04 --user root --exec apt-get install --yes --no-install-recommends util-linux iproute2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --terminate Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --set-default Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Reuse the original install.ps1 loopback-HTTPS fixture sequence. Only
      # disposable fixture trust signs a Linux copy; original dist stays intact.
      # No gateway, managed session or model fixture runs until the namespace.
      - name: Original signed fixture install through install.ps1, without setup
        timeout-minutes: 10
        run: |
          . ./dist/install.ps1
          $distribution = 'Ubuntu-24.04'
          $workspace = (wsl --distribution $distribution --exec wslpath -a "$PWD").Trim()
          $linuxHome = (wsl --distribution $distribution --exec sh -c 'printf %s "$HOME"').Trim()
          if ($linuxHome -cne '/home/journey') { throw 'Not the disposable ordinary user HOME' }
          wsl --distribution $distribution --cd "$workspace" --exec sh -c `
            'umask 077; sh candidate/.github/scripts/journey.sh prepare dist "$HOME/journey"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $startSource = @'
          import os, sys
          from pathlib import Path
          home = Path.home()
          pidfile = home / 'journey/server.pid'
          pending = pidfile.with_suffix('.pending')
          pending.write_text(str(os.getpid()))
          pending.replace(pidfile)
          if (home / 'journey/server.stop').exists():
              sys.exit(0)
          os.execv(sys.executable, [sys.executable, '-I', 'candidate/.github/scripts/journey_fixture.py',
              'serve-files', '--dir', str(home / 'journey/release'),
              '--port-file', str(home / 'journey/port'), '--cert', str(home / 'tls/server.pem'),
              '--key', str(home / 'tls/server.key')])
          '@
          $stopSource = @'
          import os, signal, time
          from pathlib import Path
          home = Path.home()
          (home / 'journey/server.stop').touch()
          pidfile = home / 'journey/server.pid'
          if pidfile.exists():
              pid = int(pidfile.read_text())
              try:
                  os.kill(pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              for attempt in range(100):
                  try:
                      state = Path(f'/proc/{pid}/stat').read_text().rsplit(')', 1)[1].split()[0]
                  except FileNotFoundError:
                      break
                  if state == 'Z':
                      break
                  time.sleep(0.05)
              else:
                  raise SystemExit('the Linux loopback server did not exit')
          print('Linux loopback install server stopped (or prevented from starting)')
          '@
          $startEncoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($startSource))
          $stopEncoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($stopSource))
          $server = $null
          try {
            $server = Start-Process -FilePath wsl.exe -PassThru -NoNewWindow -ArgumentList @(
              '--distribution', $distribution, '--cd', $workspace, '--exec', 'python3', '-I', '-c',
              "exec(__import__('base64').b64decode('$startEncoded'))")
            $port = ''
            foreach ($attempt in 1..60) {
              $port = "$(wsl --distribution $distribution --exec sh -c 'cat "$HOME/journey/port" 2>/dev/null')".Trim()
              if ($port) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $port) { throw 'the loopback https install server did not start' }
            $version = (Get-Content dist/MANIFEST.json -Raw | ConvertFrom-Json).version
            if ($version -cne '1.1.0') { throw 'Unexpected installed version' }
            $sum = (Get-FileHash dist/install.sh -Algorithm SHA256).Hash.ToLowerInvariant()
            Invoke-Main -Distribution $distribution -AssumeYes -NoSetup -InstallerUrl "https://localhost:$port/install.sh" `
              -InstallerSha256 $sum -InstallerArguments @('--from-dir', "$linuxHome/journey/release",
                '--allowed-signers', "$linuxHome/journey/key/allowed_signers", '--no-modify-path')
            if ($script:MainExitCode -ne 0) { throw 'install.ps1 failed' }
          } finally {
            try {
              wsl --distribution $distribution --exec python3 -I -c "exec(__import__('base64').b64decode('$stopEncoded'))"
              if ($LASTEXITCODE -ne 0) { throw 'could not verify Linux install server cleanup' }
            } finally {
              if ($null -ne $server) { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
            }
          }
      - name: Linux scratch harness and contract-verified client prefetch (no client execution)
        timeout-minutes: 10
        run: |
          $workspace = (wsl --distribution Ubuntu-24.04 --user root --exec wslpath -a "$PWD").Trim()
          $metadata = (wsl --distribution Ubuntu-24.04 --user root --exec wslpath -a "$env:CM_DIAG_METADATA").Trim()
          wsl --distribution Ubuntu-24.04 --user root --exec sh "$workspace/harness/.github/scripts/wsl_diag.sh" `
            stage "$workspace/harness/.github/scripts" "$workspace/candidate/.github/scripts" "$metadata"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CM_DIAG_LINUX_METADATA=$metadata" >> $env:GITHUB_ENV
      - name: Contained managed turn and resume, Windows-local watchdog
        timeout-minutes: 8
        run: |
          & ./harness/.github/scripts/wsl_diag_watchdog.ps1 -MetadataDirectory "$env:CM_DIAG_METADATA" `
            -LinuxMetadata "$env:CM_DIAG_LINUX_METADATA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Original source and dist still pristine
        if: always()
        timeout-minutes: 3
        run: |
          if (@(git -C candidate status --porcelain).Count -ne 0) { throw 'Candidate source changed' }
          python harness/.github/scripts/wsl_diag.py verify-dist dist "$env:CM_DIAG_METADATA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict metadata-only validation and sanitized rewrite
        id: validate
        if: always()
        timeout-minutes: 3
        run: |
          python harness/.github/scripts/wsl_diag.py validate "$env:CM_DIAG_METADATA" "$env:CM_DIAG_UPLOAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.validate.outcome == 'success'
        with:
          name: wsl-resume-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ env.CM_DIAG_UPLOAD }}/artifact.json
            ${{ env.CM_DIAG_UPLOAD }}/dist.json
            ${{ env.CM_DIAG_UPLOAD }}/client.json
            ${{ env.CM_DIAG_UPLOAD }}/containment.json
            ${{ env.CM_DIAG_UPLOAD }}/namespace.json
            ${{ env.CM_DIAG_UPLOAD }}/resume-start.json
            ${{ env.CM_DIAG_UPLOAD }}/resume-end.json
            ${{ env.CM_DIAG_UPLOAD }}/outcome.json
            ${{ env.CM_DIAG_UPLOAD }}/watchdog.json
            ${{ env.CM_DIAG_UPLOAD }}/fixture.jsonl
            ${{ env.CM_DIAG_UPLOAD }}/snapshots.jsonl
